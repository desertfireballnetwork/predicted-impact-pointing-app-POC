name: Build APK on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs from the Actions tab (builds, but skips the release step)

permissions:
  contents: write # needed to create the GitHub Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          # Tag "v1.2.3" -> versionName "1.2.3"; manual runs use the branch name instead.
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleDebug \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Rename APK with version
        run: |
          NAME="fireball-poc-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
